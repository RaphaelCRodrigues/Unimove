
version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: unimove-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    container_name: unimove-app
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/unimove
volumes:
  mongo-data:
